[startup]

; Delay before installing the overlay, ms. Raise it if the game hangs or exits
; on startup, lower it if the HUD takes too long to appear. More overlay mods
; in the process = more delay needed.
; Пауза перед установкой оверлея, мс. Игра виснет или вылетает на запуске -
; увеличивай; оверлей появляется слишком поздно - уменьшай. Чем больше других
; модов-оверлеев, тем больше нужно.
startup_delay_ms = 15000

[toggles]

; Player list (allies).
; Список игроков (союзники).
enabled = true

; Damage section: each player's total and DPS.
; Секция урона: тотал и DPS по каждому игроку.
damage_meter_enabled = true

; Bar showing what the damage you took was made of, by type.
; Полоска: из чего состоит полученный вами урон, по типам.
damage_taken_enabled = false

; Colour the damage bar by source: 7 statuses, everything else plain.
; Красить полоску урона по источникам: 7 статусов, остальное обычным цветом.
damage_bar_by_status = true

; Draw the damage bar with a single player in the table (needs the status split).
; Рисовать полоску урона, когда в таблице один игрок (нужна разбивка по статусам).
damage_bar_solo = true

; ...only against bosses, not every regular enemy.
; ...только на боссах, а не на каждом рядовом враге.
damage_bar_solo_boss_only = true

; Floating numbers for poison / rot ticks (off = still counted, just not shown).
; Всплывающие цифры тиков яда и гнили (выкл - считаются, но не летят на экран).
floating_number_dot_enabled = true

; The same for a teammate's ticks.
; То же для тиков союзников.
floating_number_peer_dot_enabled = false

; Put that bar inside the panel (false - a plate of its own, see taken_offset).
; Эту полоску - внутрь панели (false - отдельная плашка, см. taken_offset).
damage_taken_merge_hud = true

; Poise instead of the damage number on the game's own boss bar / enemy tag.
; Стойкость вместо цифры урона на игровой полоске босса / теге врага.
boss_poise_meter = true
enemy_poise_meter = true

; Show yourself in the player list.
; Показывать себя в списке игроков.
show_self = false

; What to show in a player row.
; Что показывать в строке игрока.
show_character_name = true
show_steam_name = false
show_level = true
show_deaths = false
show_ping = true

; Bars in a player row.
; Полоски в строке игрока.
show_hp_bar = true
show_stamina_bar = true
show_mana_bar = true

; Color Steam friends' and blocked players' names.
; Красить имена друзей и заблокированных из Steam.
show_steam_relationship = false

; Floating damage numbers over players.
; Всплывающие цифры урона над игроками.
floating_number_damage_enabled = false

; Floating status-buildup percentages.
; Всплывающие проценты набора статус-эффектов.
floating_number_buildup_enabled = false

; Show only your own numbers.
; Показывать только свои цифры.
floating_number_self_only = false

; Plain hits. false - only status bursts.
; Обычные удары. false - только вспышки статусов.
floating_number_plain_hits_enabled = true

; Same for teammates: their plain hits, their status bursts.
; То же для союзников: их обычные удары, их вспышки статусов.
floating_number_peer_hits_enabled = true
floating_number_peer_procs_enabled = true

; Merge quick repeated hits on one target into one growing number.
; Складывать частые удары по одной цели в одно растущее число.
floating_number_merge_hits = true

; Hit counter ("x3") on a merged number. Needs floating_number_merge_hits.
; Счётчик ударов ("x3") у слитого числа. Нужен floating_number_merge_hits.
floating_number_combo_enabled = true

; All damage-number animation: pop, tilt, splash, sparks, flight.
; Вся анимация цифр урона: подскок, наклон, вспышка, искры, полёт.
animations_enabled = true

; Which damage types to mark. Physical is in almost every hit, hence off.
; Какие типы урона отмечать. Физика почти в каждом ударе, поэтому выключена.
damage_type_physical = false
damage_type_magic = true
damage_type_fire = true
damage_type_lightning = true
damage_type_holy = true

; Three independent ways to show the type - any combination, including none.
; Три независимых способа показать тип - любая комбинация, включая "ни одного".

; Tint the digits themselves (turns off the gold damage-size ramp).
; Красить сами цифры (отключает золотую шкалу по величине урона).
damage_type_gradient = false

; Thin split strip under the number.
; Тонкая полоска разбивки под числом.
damage_type_bar = false

; Quiet animation behind the number: motes, embers, arc, halo.
; Тихая анимация за числом: искры, угли, дуга, ореол.
damage_type_motion = true

; Types on teammates' numbers too. Needs the same mod version on their side.
; Тип урона и на цифрах союзников. Нужна та же версия мода у них.
damage_type_peer = false

; Numbers follow you as you move. Off - they stay where the hit landed.
; Цифры следуют за вами при движении. Выкл - стоят на месте удара.
floating_number_follow_camera = false
floating_number_buildup_follow_camera = true
floating_number_dot_follow_camera = true

; Share damage and procs with teammates over Steam. Without it, no teammate numbers.
; Обмен уроном и проками с напарниками по Steam. Без этого чисел напарников нет.
network_share_damage = true

; Co-op text chat.
; Текстовый чат кооператива.
chat_enabled = true

; Newest messages on top.
; Новые сообщения сверху.
chat_newest_top = false

; Input box above the message log.
; Поле ввода над списком сообщений.
chat_input_top = false

[keys]
; Any ImGui key name: F1-F12, A-Z, Alpha0-Alpha9, Home, End, Tab, GraveAccent, ...
; Любое имя клавиши ImGui: F1-F12, A-Z, Alpha0-Alpha9, Home, End, Tab, GraveAccent, ...

; In-game settings window.
; Окно настроек в игре.
settings_toggle = F5

; Re-read this file, fonts included.
; Перечитать этот файл, вместе со шрифтами.
reload = F6

; Open the chat input. Enter sends, Escape closes.
; Открыть ввод чата. Enter отправляет, Escape закрывает.
chat = Enter

[panel]

; Panel offset from the top-right corner, in pixels.
; Отступ панели от правого верхнего угла, в пикселях.
offset_x = 1634
offset_y = 155

; Same for the standalone "Taken" plate (damage_taken_merge_hud = false).
; То же для отдельной плашки "Получено" (damage_taken_merge_hud = false).
taken_offset_x = 16
taken_offset_y = 300

; Chat offset from the bottom-left corner, in pixels.
; Отступ чата от левого нижнего угла, в пикселях.
chat_offset_x = 16
chat_offset_y = 230

; Chat box size. Drag its bottom-right corner in game to change.
; Размер окна чата. Меняется перетаскиванием за правый нижний угол в игре.
chat_width = 440
chat_height = 260

; Panel width, in pixels. Height is automatic.
; Ширина панели, в пикселях. Высота подбирается сама.
panel_width = 300

; Scales the whole panel at once, 0.5 - 2.0. Sizes below stay as written.
; Общий масштаб панели, 0.5 - 2.0. Размеры ниже остаются как записаны.
ui_scale = 1.00

; Opacity, 0.0 (clear) - 1.0 (opaque): panel background, its border, F5 window.
; Прозрачность, 0.0 (прозрачно) - 1.0 (непрозрачно): фон панели, окантовка, окно F5.
background_opacity = 0.30
border_opacity = 0.50
settings_window_opacity = 0.70

; Panel corner rounding, in pixels.
; Скругление углов панели, в пикселях.
panel_rounding = 16

; Width of the colored rail left of a player row.
; Ширина цветной полоски слева от строки игрока.
rail_width = 0

; Bar heights in a player row, in pixels.
; Высота полосок в строке игрока, в пикселях.
hp_bar_height = 15
stamina_bar_height = 5
mana_bar_height = 5

; Row heights, in pixels.
; Высота строк, в пикселях.
player_row_height = 58
damage_row_height = 28

; Height of the "% of boss max HP" bar under a damage row.
; Высота полоски "% от макс. HP босса" под строкой урона.
damage_bar_height = 7

; Ping at or above this (ms) is drawn red.
; Пинг от этого значения (мс) красится в красный.
high_ping_ms = 100

[floating numbers]

; Spawn height above the player's feet, in meters.
; Высота появления над ногами игрока, в метрах.
floating_number_world_height = 1.30

; Where damage numbers sit next to the player, in pixels (+ right/down).
; Где цифры урона стоят возле игрока, в пикселях (+ вправо/вниз).
floating_number_offset_x = -300
floating_number_offset_y = 0

; Same for status buildup % and the proc bursts - own column by default.
; То же для процентов статуса и вспышек проков - по умолчанию своя колонка.
floating_number_buildup_offset_x = 300
floating_number_buildup_offset_y = 0

; Distance (m) at which a number is full size; farther is smaller.
; Дистанция (м), на которой цифра полного размера; дальше - мельче.
floating_number_ref_distance_meters = 8

; How high (px) a number is thrown. 0 - it doesn't move.
; На какую высоту (px) подбрасывает цифру. 0 - не двигается.
floating_number_rise_px = 0

; The three below only matter when floating_number_rise_px is above 0.
; Три ключа ниже работают, только если floating_number_rise_px больше 0.

; How long (ms) the throw takes.
; Сколько (мс) длится бросок.
floating_number_flight_ms = 450

; Arc of the throw: 0 - straight rise, 1 - a thrown arc.
; Дуга броска: 0 - прямой подъём, 1 - бросок дугой.
floating_number_arc = 0.00

; Sideways spread, in pixels - a burst fans out. 0 - straight up.
; Разлёт вбок, в пикселях - серия ударов идёт веером. 0 - строго вверх.
floating_number_drift_px = 0

; Degrees a number lands tilted at, straightening out. 0 - upright.
; На сколько градусов цифра прилетает наклонённой и выравнивается. 0 - прямо.
floating_number_tilt_deg = 5.0

; Delay (ms) between digits appearing. 0 - all at once.
; Задержка (мс) между появлением цифр. 0 - все сразу.
floating_number_digit_stagger_ms = 22

; How long (ms) the impact splash lasts. 0 - off.
; Сколько (мс) длится всплеск удара. 0 - выкл.
floating_number_flash_ms = 150

; Ember shards on a status proc, and how far (px) the burst shakes.
; Угольки при проке статуса и на сколько (px) трясётся вспышка.
floating_number_sparks = true
floating_number_crit_shake = 3

; Dark contour behind every number, and the aura around status procs. 0 - off.
; Тёмный контур за каждой цифрой и сияние вокруг проков статуса. 0 - выкл.
floating_number_outline = 1.00
floating_number_glow = 1.00

; Damage at which the color ramp tops out. Lower it if your numbers stay pale.
; Урон, на котором шкала цвета доходит до верха. Меньше - если цифры бледные.
floating_number_gradient_max_damage = 5000

; Show a teammate's numbers only within this many meters. 0 - no limit.
; Показывать цифры союзника, только если он ближе стольких метров. 0 - без предела.
floating_number_peer_radius_meters = 100

; Opacity of numbers: teammates', yours.
; Прозрачность цифр: союзников, ваших.
floating_number_peer_opacity = 0.80
floating_number_self_opacity = 1.00

[colors]
; hex: RRGGBB or RRGGBBAA (with alpha), "#" optional.
; hex: RRGGBB или RRGGBBAA (с прозрачностью), "#" необязателен.

; Headers, border, damage bars.
; Заголовки, окантовка, бары урона.
accent_color = 615847FF

; Player name: default, yours, a friend's, a blocked player's.
; Имя игрока: обычное, ваше, друга, заблокированного.
name_color = 9E8C68FF
local_player_color = 9E8C68FF
friend_color = 9E8C68FF
blocked_color = F27373FF

; Secondary text and its dimmer variant.
; Второстепенный текст и его более тусклый вариант.
meta_color = E0E0EBFF
meta_dim_color = C2C2D1FF

; HP bar and the trail left when HP drops / is restored.
; Полоска HP и след при потере / восполнении HP.
hp_bar_color = 8E2626FF
hp_damage_chip_color = E0C24AFF
hp_heal_chip_color = AEF2C4FF

; "Plain damage" segment on the damage bar - parchment, like a plain hit number.
; Отрезок "обычный урон" на полоске - пергамент, как и цифра обычного удара.
damage_bar_plain_color = D5CBB0FF

; How far status colours on the damage bar are pulled toward the plain colour.
; Насколько цвета статусов на полоске утянуты к цвету обычного урона.
damage_bar_status_mix = 0.45

; Stamina and mana bars.
; Полоски выносливости и маны.
stamina_bar_color = 5C8E3DFF
mana_bar_color = 2E6B99FF

; Ping: good, medium, high.
; Пинг: хороший, средний, высокий.
ping_good_color = 78D178FF
ping_warn_color = E6B852FF
ping_bad_color = ED6B6BFF

; Your hits: small damage, big damage. Third - teammates' hits.
; Ваши удары: слабый урон, сильный. Третий - удары союзников.
floating_number_hit_color = E8E0CEFF
floating_number_hit_color_high = FFC81EFF
floating_number_peer_hit_color = B9C6D6FF

[fonts]

; Paths to .ttf files: panel, panel bold, damage numbers.
; If a file can't be read, the default is used. Press the reload key (F6) after editing.
; Пути к .ttf: панель, панель жирным, цифры урона.
; Если файл не читается, берётся шрифт по умолчанию. После правки нажмите (F6).
ui_font_path = C:\Windows\Fonts\pala.ttf
ui_bold_font_path = C:\Windows\Fonts\palab.ttf
floating_number_font_path = C:\Windows\Fonts\impact.ttf

; Fallback for Chinese/Japanese/Korean characters the fonts above lack.
; Запасной шрифт для китайских/японских/корейских символов.
cjk_font_path = C:\Windows\Fonts\msyh.ttc

; Panel text sizes, in pixels: name, secondary, headers, DPS.
; Размеры текста панели, в пикселях: имя, второстепенный, заголовки, DPS.
name_font_size = 19
meta_font_size = 17
caption_font_size = 17
dps_font_size = 17

; Floating number sizes: burst/proc, plain hit, buildup percent.
; Размеры всплывающих цифр: вспышка/прок, обычный удар, процент набора.
floating_number_big_size = 66
floating_number_normal_size = 50
floating_number_buildup_size = 32
floating_number_dot_size = 32

; Bounce of a number's pop-in. 0 - no pop, 1 - very bouncy.
; Пружинистость появления цифры. 0 - без подскока, 1 - очень пружинисто.
floating_number_spring = 0.35

[timings]

; HP bar catch-up speed, in bar widths per second. 0 - instant.
; Скорость догона полоски HP, в её длинах в секунду. 0 - мгновенно.
hp_animation_speed = 0.55

; Delay (ms) before it starts catching up, so the trail can be seen.
; Задержка (мс) перед догоном, чтобы след успел прочитаться.
hp_animation_hold_ms = 450

; How long (ms) a floating number stays on screen.
; Сколько (мс) всплывающая цифра висит на экране.
floating_number_lifetime_ms = 1800

; Same for status-proc bursts.
; То же для вспышек проков статуса.
floating_number_proc_lifetime_ms = 800

; How often (ms) a blocked player's connection is torn down again.
; Как часто (мс) заново рвётся связь с заблокированным игроком.
block_retry_ms = 100

; How far back (ms) an HP drop looks for your hit. Also an F5 slider.
; Насколько назад (мс) падение HP ищет ваш удар. Есть и ползунок по F5.
attack_attribution_window_ms = 50

; Window (ms) in which a proc tints the damage burst it caused.
; Окно (мс), в котором прок подкрашивает вызванный им всплеск урона.
proc_color_window_ms = 50

; Reset the damage table after this many seconds without damage: regular enemy, boss.
; Сброс таблицы урона после стольких секунд без урона: обычный враг, босс.
auto_reset_idle_secs = 5
auto_reset_boss_idle_secs = 45

; How often (seconds) the shown DPS refreshes.
; Как часто (сек) обновляется показанный DPS.
dps_refresh_secs = 1
