# Elden Search - settings
# Delete this file to go back to the defaults; it is written again.
# Which language this panel speaks. Left on auto, the mod follows the
# language the game itself is set to. Or name one: en, fr, it, de, es,
# pt, pl, ru.
language = auto
# Positions and widths are fractions of the screen, so they hold at
# any resolution: 0.5 is halfway across. Colours are #RRGGBBAA.

[position]
pos_x = 0.163
pos_y = 0.033
field_width = 0.122

[size]
font_size = 26
pad_x = 18
pad_y = 8
field_pad_y = 1.5
corner_notch = 9.0
frame_inset = 4.0
diamond = 5.0
shadow_spread = 2.4
shadow_alpha = 13
shadow_rings = 7
sheen = 24

[colours]
text = #CFB683FF
text_soft = #A58E62FF
text_faint = #736345D9
plate_top = #24201BED
plate_bottom = #12100DF5
field = #0C0A08E6
no_match = #C86A4CFF

[behaviour]
# The grid only re-reads the filter when a tab is rebuilt, so the mod
# taps the next/previous tab keys. If you rebound them in the game,
# put your own keys here (single letters, or names like F1, PRIOR).
refresh_next = X
refresh_prev = Z
# Typing without the mouse. This key toggles: it puts the cursor in
# the search box, and pressing it again gives the keyboard back to the
# game. It is only taken while the bar is on screen. Escape is
# deliberately left alone, so closing the menu always works.
focus_key = TAB
# Optional second key that only ever releases the box (blank = none).
unfocus_key = ESCAPE
# Optional keys for the arrows beside the search bar. Empty by
# default: the
arrows are always clickable, these only add a keyboard
# way to do the same.
jump_prev_key = 
jump_next_key = 
# An optional key that empties the search in one press while the bar
# is up. It only acts while the box is not holding the keyboard -
# while typing, hold Backspace instead. Empty means no key.
clear_key = 
# Show how many matches there are altogether, beside the tab's own
# count.
show_total = 1
# Give the search box the keyboard as soon as a menu with the bar
# opens, so
the player can type without clicking or pressing the focus
# key first.
focus_on_open = 0
# Opens this mod's settings panel. Change it if another mod you use
# has already taken this key.
panel_key = F9
# Clear the search when you leave the menu. Off means the filter is
# still on next time you open it.
clear_on_close = 1
# The mod knows a menu is open partly from the mouse: the game pins
# the cursor while you are playing and stops in menus. If you play
# with a controller and the bar never appears, set this to 0 - the
# inventory screen itself then decides on its own.
mouse_menu_test = 1
# The refresh taps the tab keys, so the game plays its tab-switch
# click. This is the game's volume while that happens: 0 is silent, 1
# leaves the sound as it is.
refresh_volume = 0.75
# The mod's own sound for a search. Muted wins over custom, and custom
# wins over the bundled three.
click_mute = 0
click_custom = 0
# 1 = short click, 2 = fuller click, 3 = switch
click_sound = 1
click_volume = 1.00
# Below 1 is deeper and longer, above 1 is shorter and higher.
click_pitch = 1.00
# The settings panel's own sounds - the controls answering as you use
# them. Nothing here touches the game's audio.
panel_sounds = 1
panel_volume = 0.80
# How long each dip lasts, in milliseconds.
dip_length = 45
# Set to 0 to see the one-time "type to filter" hint again.
hint_shown = 1
# Experimental. With this on, things are also found by what they are
# and what they do, not only by their name. Talismans, armour and
# consumables are matched on the line the menu prints under their
# name, which is already in your language: search for stamina and the
# talismans that restore it appear. Weapons have no such line, so they
# are matched instead on what the game's own tables say - their type
# and the effects they build up: "katana" finds Moonveil, "bleed"
# finds Reduvia. On by default.
search_tags = 1
# Lets the search find things you do not own yet - a merchant's stock,
# the storage chest, and mods that sell through a shop. Turn it off to
# match only what you are carrying.
search_shops = 1
# Which sections of the settings panel are open. Written as you fold
# them, so the panel comes back the way you left it. Resetting
# everything puts them back to keys-only.
open_placement = 0
open_keys = 1
open_colours = 0
open_frame = 0
open_sound = 0
# Experimental. Normally a filtered-out item leaves an empty space
# where it was, which on a large inventory scatters the matches
# through hundreds of blanks. With this on, the matches are gathered
# to the front of the grid instead. It is off by default because the
# game uses the same positions for selecting and using items: test it
# with something you can afford to lose before trusting it.
gather_matches = 0
# Only for reporting a problem: 1 writes esb_log.txt beside this file,
# saying what the mod found in the game and which keys it is using.
# Off means no log file is created at all.
log = 0
